name: NodoAssist
options:
  bundleIdPrefix: ai.nodoassistfoundation
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  NodoAssistKit:
    path: ../shared/NodoAssistKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 147.0.0

schemes:
  NodoAssist:
    shared: true
    build:
      targets:
        NodoAssist: all
    test:
      targets:
        - NodoAssistTests
        - NodoAssistLogicTests
  NodoAssistLogicTests:
    shared: true
    build:
      targets:
        NodoAssistLogicTests: all
    test:
      targets:
        - NodoAssistLogicTests
  NodoAssistUITests:
    shared: true
    build:
      targets:
        NodoAssistUITests: all
    test:
      targets:
        - NodoAssistUITests
  NodoAssistWatchApp:
    shared: true
    build:
      targets:
        NodoAssistWatchApp: all

targets:
  NodoAssist:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - target: NodoAssistShareExtension
        embed: true
      - target: NodoAssistActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: NodoAssistWatchApp
      - package: NodoAssistKit
      - package: NodoAssistKit
        product: NodoAssistChatUI
      - package: NodoAssistKit
        product: NodoAssistProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/NodoAssistKit,$SRCROOT/../swabble" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(NODOASSIST_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: "$(NODOASSIST_CODE_SIGN_ENTITLEMENTS)"
        CODE_SIGN_STYLE: "$(NODOASSIST_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NODOASSIST_DEVELOPMENT_TEAM)"
        NODOASSIST_ACTIVE_APP_GROUP_ID: "$(NODOASSIST_APP_GROUP_ID)"
        NODOASSIST_APP_DISPLAY_NAME: NodoAssist
        NODOASSIST_URL_SCHEME: nodoassist
        PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NODOASSIST_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          NODOASSIST_ACTIVE_APP_GROUP_ID: "$(NODOASSIST_DEBUG_APP_GROUP_ID)"
          NODOASSIST_APP_DISPLAY_NAME: NodoAssist
          NODOASSIST_CODE_SIGN_ENTITLEMENTS: Sources/NodoAssist.entitlements
          NODOASSIST_APNS_ENTITLEMENT_ENVIRONMENT: development
          NODOASSIST_URL_SCHEME: nodoassist-debug
          PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_DEBUG_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
          NODOASSIST_PUSH_MODE: localSandbox
          NODOASSIST_PUSH_RELAY_BASE_URL: ""
        Release:
          NODOASSIST_CODE_SIGN_ENTITLEMENTS: Sources/NodoAssist.entitlements
          NODOASSIST_APNS_ENTITLEMENT_ENVIRONMENT: production
          NODOASSIST_PUSH_MODE: localProduction
          NODOASSIST_PUSH_RELAY_BASE_URL: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "$(NODOASSIST_APP_DISPLAY_NAME)"
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.nodoassistfoundation.app
            CFBundleURLSchemes:
              - "$(NODOASSIST_URL_SCHEME)"
        CFBundleShortVersionString: "$(NODOASSIST_MARKETING_VERSION)"
        NodoAssistCanonicalVersion: "$(NODOASSIST_IOS_VERSION)"
        NodoAssistAppGroupIdentifier: "$(NODOASSIST_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(NODOASSIST_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - location
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).bgrefresh"
        NSLocalNetworkUsageDescription: NodoAssist discovers and connects to your NodoAssist gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _nodoassist-gw._tcp
        NSCameraUsageDescription: NodoAssist uses the camera when you scan a Gateway setup QR code or ask your paired Gateway or assistant to capture a photo or short video from this iPhone, for example to connect to your Gateway or show your assistant a document, device screen, or workspace.
        NSCalendarsUsageDescription: NodoAssist uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: NodoAssist uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: NodoAssist uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: NodoAssist uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: NodoAssist uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: NodoAssist can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: NodoAssist uses the microphone for realtime chat, voice wake, push-to-talk, and voice notes.
        NSMotionUsageDescription: NodoAssist may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: NodoAssist lets your assistant read photos you allow and lets you choose photos to share.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSRemindersFullAccessUsageDescription: NodoAssist uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: NodoAssist uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NodoAssistPushMode: "$(NODOASSIST_PUSH_MODE)"
        NodoAssistPushRelayBaseURL: "$(NODOASSIST_PUSH_RELAY_BASE_URL)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  NodoAssistShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: NodoAssistKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NODOASSIST_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/NodoAssistShareExtension.entitlements
        CODE_SIGN_STYLE: "$(NODOASSIST_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NODOASSIST_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        NODOASSIST_ACTIVE_APP_GROUP_ID: "$(NODOASSIST_APP_GROUP_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NODOASSIST_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          NODOASSIST_ACTIVE_APP_GROUP_ID: "$(NODOASSIST_DEBUG_APP_GROUP_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_DEBUG_SHARE_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: NodoAssist Share
        CFBundleShortVersionString: "$(NODOASSIST_MARKETING_VERSION)"
        NodoAssistAppGroupIdentifier: "$(NODOASSIST_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(NODOASSIST_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  NodoAssistActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/NodoAssistActivityAttributes.swift
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NODOASSIST_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NODOASSIST_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NODOASSIST_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NODOASSIST_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_DEBUG_ACTIVITY_WIDGET_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: NodoAssist Activity
        CFBundleShortVersionString: "$(NODOASSIST_MARKETING_VERSION)"
        CFBundleVersion: "$(NODOASSIST_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  NodoAssistWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
      - path: Sources/Services/WatchSessionActivationGate.swift
        group: Sources/Services
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: AVFAudio.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(NODOASSIST_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(NODOASSIST_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(NODOASSIST_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NODOASSIST_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NODOASSIST_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        NODOASSIST_COMPANION_APP_BUNDLE_ID: "$(NODOASSIST_APP_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NODOASSIST_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          NODOASSIST_COMPANION_APP_BUNDLE_ID: "$(NODOASSIST_DEBUG_APP_BUNDLE_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_DEBUG_WATCH_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: NodoAssist
        CFBundleShortVersionString: "$(NODOASSIST_MARKETING_VERSION)"
        CFBundleVersion: "$(NODOASSIST_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(NODOASSIST_COMPANION_APP_BUNDLE_ID)"
        WKApplication: true
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf

  NodoAssistTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
      - path: WatchApp/Sources/WatchDeferredPayloadOrdering.swift
        group: WatchApp/Sources
    dependencies:
      - target: NodoAssist
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NODOASSIST_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NODOASSIST_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NODOASSIST_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NodoAssist.app/NodoAssist"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_DEBUG_APP_BUNDLE_ID).tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: NodoAssistTests
        CFBundleShortVersionString: "$(NODOASSIST_MARKETING_VERSION)"
        CFBundleVersion: "$(NODOASSIST_BUILD_VERSION)"

  NodoAssistLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
      - path: WatchApp/Sources/WatchVoiceTurnTracker.swift
        group: WatchApp/Sources
    dependencies:
      - package: NodoAssistKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NODOASSIST_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NODOASSIST_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NODOASSIST_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_DEBUG_APP_BUNDLE_ID).logic-tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: NodoAssistLogicTests
        CFBundleShortVersionString: "$(NODOASSIST_MARKETING_VERSION)"
        CFBundleVersion: "$(NODOASSIST_BUILD_VERSION)"

  NodoAssistUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: NodoAssist
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(NODOASSIST_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(NODOASSIST_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NODOASSIST_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_APP_BUNDLE_ID).ui-tests"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TEST_TARGET_NAME: NodoAssist
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(NODOASSIST_DEBUG_APP_BUNDLE_ID).ui-tests"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleDisplayName: NodoAssistUITests
        CFBundleShortVersionString: "$(NODOASSIST_MARKETING_VERSION)"
        CFBundleVersion: "$(NODOASSIST_BUILD_VERSION)"
