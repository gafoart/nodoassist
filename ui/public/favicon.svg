<?xml version="1.0" encoding="UTF-8"?>
<!-- Tab favicon. The ring flips to white under a dark UA theme: at 16px the
     navy ring would otherwise sink into a dark tab strip and leave only the
     green core visible. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 244.2 244.2">
  <style>
    .ring { fill: #101820; }
    .core { fill: #72b74d; }
    @media (prefers-color-scheme: dark) {
      .ring { fill: #ffffff; }
    }
  </style>
