services:
  - type: web
    name: nodoassist
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODOASSIST_GATEWAY_PORT
        value: "8080"
      - key: NODOASSIST_STATE_DIR
        value: /data/.nodoassist
      - key: NODOASSIST_WORKSPACE_DIR
        value: /data/workspace
      - key: NODOASSIST_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: nodoassist-data
      mountPath: /data
      sizeGB: 1
